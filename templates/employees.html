{% extends "base.html" %}
{% block content %}
<h1>Sales Force</h1>
<div class="panel">
<table><tr><th>ID</th><th>Name</th><th>Role</th><th>Region</th><th>Territory</th><th>Action</th></tr>
{% for e in employees %}
<tr>
<td>{{e.employee_id}}</td><td>{{e.employee_name}}</td><td>{{e.role}}</td>
<td>{{e.region}}</td><td>{{e.territory}}</td>
<td><a class="button" href="/calculate/{{e.employee_id}}">Calculate</a></td>
</tr>
{% endfor %}
</table>
</div>
{% endblock %}
